name: Metaplex offline candidate11 raw gate
on:
  push:
    branches: [startrack3r/metaplex-candidate11-offline-ci]
    paths:
      - .github/workflows/verify.yml
      - research/metaplex-candidate11-offline/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: metaplex-candidate11-offline
  cancel-in-progress: false
jobs:
  raw-source-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/verify.yml
            /research/metaplex-candidate11-offline/
            /repro/pump/metaplex-candidate-build-11/upstream-source-manifest.json
            /repro/pump/metaplex-candidate-build-11/source-manifest.json
            /repro/pump/metaplex-candidate-build-11/source.patch
      - name: Check source and raw identity gates
        run: python3 -B research/metaplex-candidate11-offline/test_rebuild.py
      - name: Acquire pinned inputs then compile with network disabled
        run: >-
          python3 -B research/metaplex-candidate11-offline/rebuild.py
          --output "$RUNNER_TEMP/metaplex-candidate11"
      - name: Retain executed workflow and revision
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/metaplex-candidate11/evidence"
          cp .github/workflows/verify.yml "$RUNNER_TEMP/metaplex-candidate11/evidence/executed-workflow.yml"
          git rev-parse HEAD > "$RUNNER_TEMP/metaplex-candidate11/evidence/source-commit.txt"
      - name: Preserve actual success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metaplex-candidate11-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/metaplex-candidate11/evidence
          if-no-files-found: error
          retention-days: 30
