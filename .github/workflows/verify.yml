name: Metaplex isolated compiler observation
on:
  push:
    branches: [startrack3r/metaplex-compiler-observation-ci]
    paths: [.github/workflows/verify.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: metaplex-compiler-observation
  cancel-in-progress: false
jobs:
  runner-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check supported isolated runner capabilities
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          {
            printf 'repository=%s\ncommit=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            uname -m
            python3 --version
            docker version --format '{{json .Server}}'
          } > evidence/runner-preflight.txt
      - name: Retain observed runner capabilities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metaplex-runner-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
