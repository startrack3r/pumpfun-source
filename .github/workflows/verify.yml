name: Fees visibility compiler observation
on:
  push:
    branches: [startrack3r/fees-visibility-trace-ci]
    paths:
      - .github/workflows/verify.yml
      - research/fees-visibility-trace/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fees-visibility-trace
  cancel-in-progress: false
jobs:
  paired-source-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/verify.yml
            /research/fees-visibility-trace/
      - name: Verify source and diagnostic-only instrumentation
        run: python3 -B research/fees-visibility-trace/test_inputs.py
      - name: Acquire public inputs then capture both offline compiler traces
        run: >-
          python3 -B research/fees-visibility-trace/run.py
          --output "$RUNNER_TEMP/fees-visibility-trace"
      - name: Retain workflow and controller revision
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/fees-visibility-trace/evidence"
          cp .github/workflows/verify.yml "$RUNNER_TEMP/fees-visibility-trace/evidence/executed-workflow.yml"
          git rev-parse HEAD > "$RUNNER_TEMP/fees-visibility-trace/evidence/source-commit.txt"
      - name: Preserve success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fees-visibility-trace-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fees-visibility-trace/evidence
          if-no-files-found: error
          retention-days: 30
