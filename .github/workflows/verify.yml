name: Metaplex isolated branch layout probe
on:
  push:
    branches: [startrack3r/metaplex-branch-layout-ci]
    paths:
      - .github/workflows/verify.yml
      - research/metaplex-branch-layout/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: metaplex-branch-layout
  cancel-in-progress: false
jobs:
  layout-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/verify.yml
            /research/metaplex-branch-layout/
      - name: Verify exact basic block contents across variants
        run: python3 -B research/metaplex-branch-layout/test_probe.py
      - name: Compile isolated IR with networking disabled
        run: >-
          python3 -B research/metaplex-branch-layout/probe.py
          --output "$RUNNER_TEMP/metaplex-branch-layout"
      - name: Retain workflow and actual controller revision
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/metaplex-branch-layout/evidence"
          cp .github/workflows/verify.yml "$RUNNER_TEMP/metaplex-branch-layout/evidence/executed-workflow.yml"
          cp research/metaplex-branch-layout/test_probe.py "$RUNNER_TEMP/metaplex-branch-layout/evidence/test_probe.py"
          git rev-parse HEAD > "$RUNNER_TEMP/metaplex-branch-layout/evidence/source-commit.txt"
      - name: Preserve success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metaplex-branch-layout-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/metaplex-branch-layout/evidence
          if-no-files-found: error
          retention-days: 30
