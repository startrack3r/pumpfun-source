name: Fees controlled guard split
on:
  push:
    branches: [startrack3r/fees-guard-split-build-ci]
    paths:
      - .github/workflows/verify.yml
      - research/fees-guard-split-build/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fees-guard-split
  cancel-in-progress: false
jobs:
  paired-source-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/verify.yml
            /research/fees-guard-split-build/
      - name: Verify the single source delta and baseline gate
        run: python3 -B research/fees-guard-split-build/test_inputs.py
      - name: Acquire public inputs then run both offline compilations
        run: >-
          python3 -B research/fees-guard-split-build/run.py
          --output "$RUNNER_TEMP/fees-guard-split"
      - name: Retain workflow and controller revision
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/fees-guard-split/evidence"
          cp .github/workflows/verify.yml "$RUNNER_TEMP/fees-guard-split/evidence/executed-workflow.yml"
          git rev-parse HEAD > "$RUNNER_TEMP/fees-guard-split/evidence/source-commit.txt"
      - name: Preserve success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fees-guard-split-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fees-guard-split/evidence
          if-no-files-found: error
          retention-days: 30
